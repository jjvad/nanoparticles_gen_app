version: "3.9"

services:
  backend:
    build: ./backend
    container_name: nanoparticle_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./models_storage:/models
    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: nanoparticle_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend